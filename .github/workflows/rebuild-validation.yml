name: Rebuild validation
on:
  push:
    branches: [rebuild/strategy-first]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check lease-engine.js
          node --check strategy-domain.js
          node --check scenario-adapter.js
          node --check agency-fees.js
          node --check investment-returns.js
          node --check scenario-comparison.js
      - name: Unit tests
        run: |
          node lease-engine.test.js
          node strategy-domain.test.js
          node agency-fees.test.js
          node scenario-adapter.test.js
          node investment-returns.test.js
          node scenario-comparison.test.js
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Rebuilt workspace browser smoke
        run: node workspace-smoke.test.js
      - name: Legacy browser smoke
        run: node browser-smoke.test.js

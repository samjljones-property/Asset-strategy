name: Browser smoke tests
on:
  push:
    paths:
      - 'index.html'
      - 'lease-engine.js'
      - 'browser-smoke.test.js'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'lease-engine.js'
      - 'browser-smoke.test.js'
      - '.github/workflows/browser-smoke.yml'
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node browser-smoke.test.js
